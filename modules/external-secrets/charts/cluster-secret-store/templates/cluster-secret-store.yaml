# No "auth" block: the controller uses its own pod credentials (the IRSA role on its ServiceAccount)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
  {{- with .Values.namespaces }}
  conditions:
    - namespaces:
        {{- toYaml . | nindent 8 }}
  {{- end }}
